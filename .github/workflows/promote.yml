name: promote

# Promotion pipeline: dev -> qa -> main.
#
# Pushing to dev prepares a PR into qa; landing on qa prepares a PR into main.
# The PR is raised against a prepared `promote/<src>-to-<tgt>` branch rather
# than against `dev`/`qa` directly, for two reasons:
#
#   1. VERSION is BRANCH-OWNED. Each branch advances its own counter (see
#      version-bump.yml). A straight merge would drag the source branch's
#      VERSION into the target -- so if someone set dev to 10.00, qa would
#      inherit it instead of going 1.45 -> 1.46. This job pins every tracked
#      VERSION file back to the target's value, so promotion carries CODE ONLY.
#   2. Pinning VERSION here also RESOLVES what would otherwise be a recurring
#      merge conflict on that file, which would stall every promotion PR.
#
# Any OTHER conflict is left unresolved on purpose: the job fails loudly so a
# human resolves it, rather than a bot guessing at real code.
#
# PROMOTION IS BATCHED, NOT PER-COMMIT. This previously ran `on: push` to dev
# and qa, so every single commit to dev immediately raised (or force-pushed) a
# PR into qa, and merging that PR was itself a push to qa, which immediately
# raised the next PR into main. Unfinished work was therefore permanently in
# flight toward production and neither gate ever batched anything.
#
# ONE ORIGINAL PR PER PROMOTION PR. Batching the CADENCE is right; batching the
# CONTENT was not. A single promotion PR used to carry everything that had
# accumulated on dev -- a 22-file diff spanning unrelated work -- and that broke
# the only thing promotion exists for, which is review. The skeptical-review
# panel measurably ran out of its per-review file budget on these PRs and
# rejected them for "could not verify X" rather than for any real defect.
#
# So `promote.sh` runs with PROMOTE_SPLIT=1: it cuts the promotion back to the
# original units of work (dev's first-parent commits -- one per merged PR, one
# per direct push) and promotes the OLDEST un-promoted one. Each promotion PR
# then shows one coherent change that a reviewer can actually hold. Units are
# promoted strictly in landing order, by merging an ancestor of dev rather than
# by cherry-picking, so this introduces no conflicts that the all-at-once merge
# did not already have. See promote.sh for the full rationale.
#
# Promotion is driven three ways, and ALL of them only ever OPEN a PR:
#   * On a SCHEDULE (see `on.schedule`): once per weekday this prepares/refreshes
#     one dev -> qa PR and one qa -> main PR. This is a cadence, not a per-commit
#     trigger, so it does not reintroduce the churn/cascade above -- and because
#     nothing here merges, unfinished work never advances on its own; a human
#     still reviews and merges (or closes) each PR.
#   * WHEN qa ADVANCES (see `on.push`): landing a promotion into qa prepares the
#     NEXT dev -> qa unit, so the queue drains at the speed it is reviewed
#     instead of one unit per calendar day. This is deliberately NOT the old
#     cascade: qa can only be pushed to by merging a PR, this route is pinned to
#     the dev -> qa hop ONLY, and nothing about it moves code toward main. The
#     loop is self-terminating -- preparing a PR is not a push, so it fires again
#     only when a human or AppBuilder merges the PR it just prepared.
#   * BY HAND (see `on.workflow_dispatch`): run with `source: dev` (dev -> qa) or
#     `source: qa` (qa -> main) to prepare that hop immediately, e.g. between
#     scheduled runs. Identical output to the scheduled path.
# When there is nothing new to promote, promote.sh no-ops and no PR is opened.
#
# CI is unaffected -- ci.yml still runs on every dev push and on every PR, so
# day-to-day feedback stays automatic. Only the decision to MERGE is manual.
#
# THIS WORKFLOW NEVER MERGES. Every route it supports ends at an OPEN PR that a
# human merges. That includes the dev -> main override below.
#
# ROUTES (allowlisted in "Resolve source and target"):
#   dev -> qa     normal    (source: dev)                  -- the default
#   qa  -> main   normal    (source: qa)
#   dev -> main   OVERRIDE  (source: dev, target: main)    -- skips qa
#
# The dev -> main route exists for an urgent fix that cannot wait for a qa
# cycle. It is NOT a hole in the promotion order: it produces the single
# well-known branch name `promote/dev-to-main`, which branch-flow.yml allows
# into main *by that exact name only*. An arbitrary branch aimed at main is
# still rejected. The trade-off is deliberate and visible -- the run logs a
# warning, and the WebUI button that dispatches it is styled as destructive and
# requires a typed confirmation.

on:
  push:
    # ONLY qa. Landing a promotion into qa means the dev -> qa unit that was in
    # flight is done, so prepare the next one. Not dev (that is the per-commit
    # churn this workflow exists to avoid) and not main (nothing may advance
    # toward production on its own).
    branches: [qa]
  schedule:
    # Weekdays at 13:00 UTC. A scheduled run has no inputs and always fires from
    # the default branch, so it cannot express a single source/target the way a
    # manual run does -- instead the `plan` job below fans it out to BOTH normal
    # hops (dev -> qa and qa -> main). Cadence, not per-commit: it refreshes the
    # accumulated promotion PRs once a day and never merges them.
    - cron: '0 13 * * 1-5'
  workflow_dispatch:
    inputs:
      source:
        description: 'Source branch to promote from'
        required: true
        default: dev
        type: choice
        options: [dev, qa]
      # Optional. 'auto' keeps the historical behaviour exactly: dev -> qa,
      # qa -> main, so existing callers that pass only `source` are unchanged.
      # Setting it explicitly is what makes the dev -> main override
      # expressible (source: dev, target: main) -- the emergency path that
      # skips qa. Still only ever OPENS a PR; see the note below.
      target:
        description: 'Target branch (auto = the normal next step)'
        required: false
        default: auto
        type: choice
        options: [auto, qa, main]

permissions:
  contents: write
  pull-requests: write
  actions: write   # to release the promotion PR's own CI run (see last step)

jobs:
  # Fan the trigger out to the concrete promotion routes to run. A manual
  # dispatch yields exactly one route (honouring source/target, including the
  # dev -> main override). A scheduled run yields both normal hops so the daily
  # cadence prepares/refreshes the dev -> qa AND qa -> main PRs in one go.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      routes: ${{ steps.plan.outputs.routes }}
    steps:
      - name: Resolve routes
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Both normal forward hops. dev -> main is intentionally NOT part of
            # the automatic cadence: it is the manual-only urgent override.
            routes='[{"src":"dev","tgt":"qa"},{"src":"qa","tgt":"main"}]'
            echo "Scheduled run: promoting dev -> qa and qa -> main"
          elif [ "${{ github.event_name }}" = "push" ]; then
            # qa just advanced, so the dev -> qa unit that was in flight has
            # landed: queue the next one. Pinned to this one hop -- a push to qa
            # must never start anything moving toward main.
            routes='[{"src":"dev","tgt":"qa"}]'
            echo "qa advanced: preparing the next dev -> qa unit"
          else
            src="${{ github.event.inputs.source || 'dev' }}"
            tgt_in="${{ github.event.inputs.target || 'auto' }}"

            # The normal next hop, used when target is 'auto'/absent.
            case "$src" in
              dev) auto_tgt=qa ;;
              qa)  auto_tgt=main ;;
              *)   echo "::error::$src is not a promotable branch"; exit 1 ;;
            esac

            if [ -z "$tgt_in" ] || [ "$tgt_in" = "auto" ]; then
              tgt="$auto_tgt"
            else
              tgt="$tgt_in"
            fi

            # Allowlist the routes that may exist, rather than trusting the two
            # inputs independently. dev->main is deliberately present: it is the
            # documented override for an urgent fix that cannot wait for a qa
            # cycle. It still only opens a PR into main -- nothing here merges.
            # NB the ':' separator: a case pattern like `dev->qa` is a bash
            # SYNTAX error, because '>' is parsed as a redirection.
            case "$src:$tgt" in
              dev:qa|qa:main) ;;
              dev:main)
                echo "::warning title=Skipping qa::Promoting dev straight to main (override path). This opens a PR; it does not merge." ;;
              *)
                echo "::error::'$src -> $tgt' is not a permitted promotion route (allowed: dev->qa, qa->main, dev->main)"
                exit 1 ;;
            esac

            routes="[{\"src\":\"$src\",\"tgt\":\"$tgt\"}]"
            echo "Manual run: promoting $src -> $tgt"
          fi
          echo "routes=$routes" >> "$GITHUB_OUTPUT"

  promote:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Independent hops: don't cancel qa->main just because dev->qa failed.
      fail-fast: false
      matrix:
        route: ${{ fromJSON(needs.plan.outputs.routes) }}
    concurrency:
      # Keyed off the branch being promoted AND the target so the two scheduled
      # hops (and any manual run) never collapse into one queue. The target is
      # part of the key because dev has two possible destinations (qa, and main
      # via the override): without it, a dev->main run would queue behind an
      # unrelated dev->qa run building a different branch.
      group: promote-${{ matrix.route.src }}-to-${{ matrix.route.tgt }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve source and target
        id: route
        run: |
          src="${{ matrix.route.src }}"
          tgt="${{ matrix.route.tgt }}"
          echo "src=$src" >> "$GITHUB_OUTPUT"
          echo "tgt=$tgt" >> "$GITHUB_OUTPUT"
          echo "branch=promote/$src-to-$tgt" >> "$GITHUB_OUTPUT"
          echo "Promoting $src -> $tgt"

      - name: Build promotion branch (code only, VERSION pinned to target)
        id: build
        env:
          SRC: ${{ steps.route.outputs.src }}
          TGT: ${{ steps.route.outputs.tgt }}
          BR: ${{ steps.route.outputs.branch }}
          # One original PR per promotion PR -- see the header and promote.sh.
          PROMOTE_SPLIT: '1'
        run: |
          git config user.name  "promote-bot[bot]"
          git config user.email "promote-bot@users.noreply.github.com"
          bash .github/scripts/promote.sh

      - name: Push promotion branch
        if: steps.build.outputs.changed == 'true'
        run: git push -f -q origin "${{ steps.route.outputs.branch }}"

      - name: Open or update the promotion PR
        if: steps.build.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SRC: ${{ steps.route.outputs.src }}
          TGT: ${{ steps.route.outputs.tgt }}
          BR: ${{ steps.route.outputs.branch }}
          UNIT_PR: ${{ steps.build.outputs.unit_pr }}
          UNIT_SUBJECT: ${{ steps.build.outputs.unit_subject }}
          REMAINING: ${{ steps.build.outputs.remaining }}
        run: |
          set -e
          # Name the ORIGINAL work, not just the hop -- with one unit per
          # promotion PR, "promote: dev -> qa" alone no longer identifies which
          # change is in flight. The `promote:` prefix is load-bearing:
          # fleet_guardrails.is_promotion matches on it.
          title="promote: $SRC -> $TGT"
          if [ -n "$UNIT_SUBJECT" ]; then
            if [ -n "$UNIT_PR" ]; then
              title="$title (#$UNIT_PR: $UNIT_SUBJECT)"
            else
              title="$title ($UNIT_SUBJECT)"
            fi
          fi
          # The panel is told to lower confidence when a PR states no intent
          # (AGENTS.md: Pull Request Intent & Specification Rule). A promotion
          # PR inherits its intent from the original PR it carries, so fetch
          # that and quote it. The old boilerplate ("carries code only") is
          # what made every recent promotion reject with ZERO code findings --
          # dns#65, le#22, opnsense#54, cppm#34, nw#128 all read "the
          # description doesn't match the diff".
          #
          # "intent is empty" is FOUR different states and they must not print the
          # same sentence: no originating PR at all, a fetch that FAILED (so the
          # section was never even looked at), a PR with no section, and a PR that
          # left the template comment unfilled. Reporting a failed fetch as "stated
          # no intent" is simply false, and it hides a broken token or a deleted PR.
          intent=""
          intent_state="no-unit"
          if [ -n "$UNIT_PR" ]; then
            # Pessimistic default: only a confirmed exit 0 clears it.
            intent_state="fetch-failed"
            unit_body="$(gh pr view "$UNIT_PR" --json body -q .body 2>/dev/null)"
            if [ $? -eq 0 ]; then
              if printf '%s\n' "$unit_body" \
                   | grep -qE '^#+.*Intent & Problem Statement'; then
                intent="$(printf '%s\n' "$unit_body" | awk '
                  /^#/ && /Intent & Problem Statement/ { f=1; next }
                  f && /^#/ { exit }
                  f { print }' | sed 's/<!--.*-->//' | sed '/^[[:space:]]*$/d')"
                if [ -n "$intent" ]; then
                  intent_state="ok"
                else
                  intent_state="unfilled"
                fi
              else
                intent_state="no-section"
              fi
            fi
          fi
          base="origin/$TGT"
          # No `|| echo 0` here: that masks a rev-list FAILURE as a genuine count
          # of 0, so the body would claim "0 commit(s)" for a promotion that may
          # carry many. Capture the real status, then default only on failure.
          ncommits="$(git rev-list --count --no-merges "$base..$BR" 2>/dev/null)"
          if [ $? -eq 0 ] && [ -n "$ncommits" ]; then
            ncommits_ok="yes"
          else
            ncommits_ok="no"
            ncommits="0"
          fi
          commits="$(git log --no-merges --format='- `%h` %s' "$base..$BR" 2>/dev/null | head -30)"
          nfiles="$(git diff --name-only "$base...$BR" 2>/dev/null | wc -l | tr -d ' ')"
          files="$(git diff --numstat "$base...$BR" 2>/dev/null \
                   | awk -F'\t' '{printf "- `%s` (+%s/-%s)\n", $3, $1, $2}' | head -30)"
          automation="$(git diff --name-only "$base...$BR" 2>/dev/null \
                        | grep -E '^\.github/|\.sh$' | sed 's/^/- `/; s/$/`/' | head -20 || true)"
          {
            printf '## Intent & Problem Statement\n\n'
            if [ -n "$UNIT_SUBJECT" ]; then
              printf 'Promotes **one unit of work** from `%s` into `%s`' "$SRC" "$TGT"
              [ -n "$UNIT_PR" ] && printf ' (originally #%s)' "$UNIT_PR"
              printf ':\n\n> %s\n\n' "$UNIT_SUBJECT"
            else
              printf 'Automated promotion of `%s` into `%s`.\n\n' "$SRC" "$TGT"
            fi
            case "$intent_state" in
              ok)
                printf 'Intent carried from #%s:\n\n' "$UNIT_PR"
                printf '%s\n' "$intent" | sed 's/^/> /'
                printf '\n' ;;
              unfilled)
                printf '_#%s has an Intent section but left it unfilled, so there is\n' "$UNIT_PR"
                printf 'no stated intent to carry. What this PR actually carries is\n'
                printf 'enumerated below._\n\n' ;;
              no-section)
                printf '_#%s stated no Intent section, so there is nothing to carry.\n' "$UNIT_PR"
                printf 'What this PR actually carries is enumerated below._\n\n' ;;
              fetch-failed)
                printf '_Could not read #%s to inherit its intent (the GitHub fetch\n' "$UNIT_PR"
                printf 'failed), so the intent below is UNKNOWN -- not absent. Review\n'
                printf 'the enumerated changes directly._\n\n' ;;
              *)
                printf '_This promotion is not tied to a single originating PR, so there\n'
                printf 'is no upstream intent to inherit. What it carries is enumerated\n'
                printf 'below._\n\n' ;;
            esac
            if [ "${REMAINING:-0}" -gt 0 ] 2>/dev/null; then
              printf 'Up to **%s** further unit(s) are queued behind this one and will\n' "$REMAINING"
              printf 'be promoted once this PR merges, oldest first.\n\n'
            fi

            printf '## Proposed Solution & Changes\n\n'
            if [ "$ncommits_ok" = "yes" ]; then
              printf 'This is a promotion, not new work: %s commit(s) touching %s file(s),\n' "$ncommits" "$nfiles"
              printf 'already reviewed and merged on the way into `%s`.\n\n' "$SRC"
            else
              printf 'This is a promotion, not new work, touching %s file(s), already\n' "$nfiles"
              printf 'reviewed and merged on the way into `%s`. The commit count could\n' "$SRC"
              printf 'not be determined (`git rev-list` failed) -- it is UNKNOWN, not zero.\n\n'
            fi
            if [ -n "$commits" ]; then
              printf '**Commits carried:**\n\n%s\n\n' "$commits"
              [ "${ncommits:-0}" -gt 30 ] 2>/dev/null && printf '_...and %s more._\n\n' "$((ncommits - 30))"
            fi
            if [ -n "$files" ]; then
              printf '**Files changed:**\n\n%s\n\n' "$files"
              [ "${nfiles:-0}" -gt 30 ] 2>/dev/null && printf '_...and %s more._\n\n' "$((nfiles - 30))"
            fi

            printf '## Guardrails & Side-Effect Assessment\n\n'
            printf -- '- Every tracked `VERSION` file is pinned to `%s`'"'"'s own sequence and\n' "$TGT"
            printf '  advanced one step here; a version set on `%s` never leaks across.\n' "$SRC"
            if [ -n "$automation" ]; then
              printf -- '- This promotion changes **automation**, so it is not behaviour-neutral.\n'
              printf '  Workflow/script paths touched:\n\n%s\n' "$automation"
            else
              printf -- '- No workflow or shell-script paths are touched.\n'
            fi
            printf '\n'

            printf '## Verification & Parity\n\n'
            printf -- '- Each commit was reviewed by the skeptical panel before merging into `%s`.\n' "$SRC"
            printf -- '- Repository CI runs on this promotion PR.\n'
          } > /tmp/promote-body.md
          existing=$(gh pr list --head "$BR" --base "$TGT" --state open --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            # The branch was force-pushed, so an existing PR's title/body can
            # describe a unit that is no longer the one in flight. Refresh it
            # rather than leaving a stale description on a live PR.
            echo "PR #$existing already open for $BR -- refreshing title and body."
            gh pr edit "$existing" --title "$title" --body-file /tmp/promote-body.md
            exit 0
          fi
          gh pr create --base "$TGT" --head "$BR" \
            --title "$title" \
            --body-file /tmp/promote-body.md

      # A PR opened with GITHUB_TOKEN does not start its checks automatically --
      # GitHub parks the run as `action_required`. On a repo that requires CI on
      # qa/main that is a DEADLOCK: the required check can never report, so the
      # promotion PR sits MERGEABLE/BLOCKED forever. Releasing the parked run
      # here keeps the pipeline hands-free. (Relaxing the fork-PR approval
      # policy does NOT fix this -- verified; it is the bot-authored PR that is
      # gated, not an untrusted contributor.)
      - name: Release the promotion PR's CI run
        if: steps.build.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BR: ${{ steps.route.outputs.branch }}
          SHA: ${{ steps.build.outputs.sha }}
        run: |
          for _ in $(seq 1 24); do
            ids=$(gh api "repos/${{ github.repository }}/actions/runs?branch=$BR&status=action_required" \
                    --jq ".workflow_runs[] | select(.head_sha == \"$SHA\") | .id" 2>/dev/null || true)
            if [ -n "$ids" ]; then
              for id in $ids; do
                echo "approving parked run $id"
                gh api -X POST "repos/${{ github.repository }}/actions/runs/$id/approve" || \
                  echo "::warning::could not approve run $id -- approve it by hand to unblock this PR"
              done
              exit 0
            fi
            sleep 5
          done
          echo "::notice::no parked run found for $BR @ $SHA"
